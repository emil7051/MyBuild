name: CI

on:
  push:
    branches: ['*']
  pull_request:

jobs:
  frontend:
    name: Frontend & Shared SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies (shared engine)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend tests (includes TS parity harness)
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend & Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r backend/requirements.txt

      - name: Lint Python (ruff)
        run: python -m ruff check calculations data analysis backend scripts tests

      - name: Check formatting (black)
        run: python -m black --check calculations data analysis backend scripts tests

      - name: Check import ordering (isort)
        run: python -m isort --check-only calculations data analysis backend scripts tests

      - name: Validate data tables
        run: python scripts/validation.py

      - name: Run pytest
        run: python -m pytest tests --cov
