[tool.isort]
profile = "black"
line_length = 88
force_sort_within_sections = true
skip = [
    "archive",
    ".venv",
    "node_modules",
]
known_first_party = [
    "backend",
    "data",
    "scripts",
    "tests",
]

[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = '''
/(
  archive
  | \.venv
  | node_modules
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
    "archive",
    "attached_assets",
]

[tool.ruff.lint]
per-file-ignores = { "data/*.py" = ["E501"], "data/**/*.py" = ["E501"], "scripts/*.py" = ["E501"], "scripts/**/*.py" = ["E501"] }

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
follow_imports = "skip"
ignore_missing_imports = true
show_error_codes = true
warn_unused_ignores = true

[tool.pytest.ini_options]
markers = [
    "enable_redis_cache: opt into Redis-backed cache behavior for focused tests",
]
