[tool.isort]
profile = "black"
line_length = 88
force_sort_within_sections = true
known_first_party = [
    "backend",
    "data",
    "scripts",
    "tests",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
    "archive",
    "attached_assets",
]
per-file-ignores = { "data/*.py" = ["E501"], "data/**/*.py" = ["E501"], "scripts/*.py" = ["E501"], "scripts/**/*.py" = ["E501"] }
