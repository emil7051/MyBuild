[tool.isort]
profile = "black"
line_length = 88
force_sort_within_sections = true
known_first_party = [
    "backend",
    "calculations",
    "calculations_engine",
    "data",
    "legacy",
    "scripts",
    "shared",
    "tests",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
    "archive",
    "attached_assets",
]
