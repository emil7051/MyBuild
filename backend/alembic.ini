# Alembic Configuration for TCO Backend
# Migrations support SQLite (development) and PostgreSQL (production)

[alembic]
# Path to migration scripts (relative to this file)
script_location = alembic

# Template used for new revision files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(rev)s_%%(slug)s

# Prepend sys.path so alembic can import from backend.app
prepend_sys_path = ..

# Timezone to use for revision file timestamps
timezone = UTC

# Max length of the slug field, for auto-generated migration names
truncate_slug_length = 40

# SQLAlchemy URL is overridden in env.py from settings
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Hooks run after generating a new revision
# Uncomment to auto-format migrations with black
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
